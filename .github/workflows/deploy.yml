name: 청약 크롤링 + Pages 배포

on:
  schedule:
    # 매일 08:00 KST = UTC 23:00 (전날)
    - cron: '0 23 * * *'
  push:
    branches: [main]
    paths:
      - 'data.json'
      - 'dashboard.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: pip install requests selenium

      - name: Run crawler
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        run: python crawler.py

      - name: Commit updated data
        id: commit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 << 'EOF'
          import json, os
          from pathlib import Path

          # viewCount·alarmCount는 매일 바뀌므로 비교에서 제외
          VOLATILE = {"viewCount", "alarmCount"}

          def canonical(apts):
              return json.dumps(
                  sorted(
                      [{k: v for k, v in a.items() if k not in VOLATILE} for a in apts],
                      key=lambda a: a.get("hash", "")
                  ),
                  ensure_ascii=False, sort_keys=True
              )

          data = json.loads(Path("data.json").read_text(encoding="utf-8"))
          sig = canonical(data.get("apts", []))

          sig_file = Path(".apt_signature")
          prev = sig_file.read_text(encoding="utf-8") if sig_file.exists() else ""
          changed = sig != prev
          sig_file.write_text(sig, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")

          print("의미 있는 변경 감지됨" if changed else "변경 없음 (viewCount 등 제외 기준)")
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json .apt_signature
          git diff --cached --quiet || git commit -m "data: $(date +'%Y-%m-%d' -d '+9 hours') 자동 업데이트"
          git push || true

      - name: Prepare deploy
        run: |
          mkdir deploy
          cp dashboard.html deploy/index.html
          cp data.json deploy/data.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: false

      - name: Send Telegram notification
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.commit.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'EOF'
          import json, os, requests
          from pathlib import Path

          data = json.loads(Path("data.json").read_text(encoding="utf-8"))
          apts = data.get("apts", [])
          updated = (data.get("updatedAt") or "")[:10]

          active = [a for a in apts if a.get("status") in (1, 2)]
          active.sort(key=lambda a: (0 if a.get("status") == 2 else 1, a.get("firstApplyDate") or "9999"))
          top = active[:5]

          def status_label(s):
              return {1: "예정", 2: "접수중", 3: "당첨발표", 4: "완료"}.get(s, "-")

          lines = [f"🏠 <b>부산 청약 현황 업데이트</b>  ({updated} 기준)\n"]
          for apt in top:
              badge = "🔴" if apt.get("status") == 2 else "🔵"
              lines.append(
                  f"{badge} <b>{apt.get('name', '-')}</b>\n"
                  f"  {apt.get('regionName', '')} | {status_label(apt.get('status', 0))} | {apt.get('dDayText', '')}\n"
                  f"  청약일: {apt.get('firstApplyDate') or '미정'}\n"
              )

          pages_url = "https://ktson-nanatoto.github.io/busan-radar/"
          lines.append(f"🔗 <a href='{pages_url}'>전체 보기</a>")

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": "\n".join(lines), "parse_mode": "HTML", "disable_web_page_preview": True},
              timeout=10,
          ).raise_for_status()
          print("텔레그램 전송 완료")
          EOF
