name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data.json'
      - 'dashboard.html'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir deploy
          cp dashboard.html deploy/index.html
          cp data.json deploy/data.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: false
